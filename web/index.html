<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Câmeras</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0d10; color: #e8eaed; font-family: system-ui, sans-serif; }
  header { padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header a { color: #9aa4b2; font-size: 13px; text-decoration: none; }
  header a:hover { color: #4da3ff; }
  header .direita { display: flex; align-items: center; gap: 14px; }
  #colunas { background: #1c2128; color: #e8eaed; border: 1px solid #30363d; border-radius: 7px; padding: 6px 8px; font-size: 13px; }
  #grade { display: grid; gap: 10px; padding: 0 10px 10px; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
  body.cheio #grade { grid-template-columns: 1fr !important; padding: 0; }
  .cam { position: relative; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 16/9; border: 2px solid transparent; }
  .cam:focus-within, .cam:hover { border-color: #4da3ff; outline: none; }
  .cam video-stream, .cam video { width: 100%; height: 100%; display: block; }
  .nome { position: absolute; left: 10px; top: 8px; padding: 3px 10px; border-radius: 6px; background: rgba(0,0,0,.55); font-size: 15px; z-index: 2; pointer-events: none; }
  .expandir, .som { position: absolute; z-index: 2; width: 34px; height: 34px; border-radius: 8px; border: none; background: rgba(0,0,0,.55); color: #fff; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .expandir { right: 8px; top: 8px; }
  .som { right: 8px; bottom: 8px; }
  .expandir:hover, .som:hover { background: rgba(0,0,0,.8); }
  .cam .mode { display: none; }
  body.cheio .cam { display: none; border-radius: 0; height: calc(100vh - 56px); aspect-ratio: auto; }
  body.cheio .cam.ativa { display: block; }
  button { background: #1c2128; color: inherit; border: 1px solid #30363d; border-radius: 8px; padding: 8px 14px; font-size: 15px; cursor: pointer; }
  .vazio { padding: 60px 20px; text-align: center; color: #9aa4b2; }
  .vazio a { color: #4da3ff; }
</style>
</head>
<body>
<header>
  <h1 id="titulo">Câmeras</h1>
  <div class="direita">
    <label>Colunas:
      <select id="colunas">
        <option value="auto">Automático</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </label>
    <a href="javascript:void(0)" id="linkConfig" target="_blank">⚙ Configurar câmeras</a>
  </div>
  <button id="voltar" hidden>← Voltar</button>
</header>
<div id="grade"></div>

<script src="video-stream.js" type="module"></script>
<script type="module">
// video-stream.js é carregado como module (sempre adiado); este também precisa ser
// module para rodar DEPOIS dele — senão o elemento <video-stream> é criado antes de
// existir o "molde" e a câmera só conecta depois de um clique.
import { CAMERAS } from "./cameras.generated.js";

// aponta "Configurar câmeras" para a mesma máquina, na porta da tela de configuração
document.getElementById("linkConfig").href = `http://${location.hostname}:8766/`;

const grade = document.getElementById("grade");
const voltar = document.getElementById("voltar");

// Número de colunas da grade — lembrado por aparelho (TV, celular, PC têm telas
// diferentes, cada um guarda sua própria preferência no próprio navegador).
const colunasSel = document.getElementById("colunas");
function aplicarColunas(valor) {
  grade.style.gridTemplateColumns = valor === "auto" ? "" : `repeat(${valor}, 1fr)`;
}
let colunasSalvas = "auto";
try { colunasSalvas = localStorage.getItem("localcam_colunas") || "auto"; } catch (e) {}
colunasSel.value = colunasSalvas;
aplicarColunas(colunasSalvas);
colunasSel.addEventListener("change", () => {
  aplicarColunas(colunasSel.value);
  try { localStorage.setItem("localcam_colunas", colunasSel.value); } catch (e) {}
});

function montar(cam, cheio) {
  const v = document.createElement("video-stream");
  v.src = new URL("api/ws?src=" + (cheio ? cam.alta : cam.leve), location.href);
  return v;
}

// Desliga os controles nativos do <video> e liga o nosso botão de som. Sem isso, o
// controle nativo de volume (que no mobile pode cair bem em cima do nosso botão de
// expandir) rouba o toque antes de chegar na gente — e o desmudo nunca "pega".
function ligarSom(box, v) {
  const botao = box.querySelector(".som");
  const atualizar = () => {
    const mudo = !v.video || v.video.muted;
    botao.textContent = mudo ? "🔇" : "🔊";
  };
  if (v.video) {
    v.video.controls = false;
  } else {
    // o <video> interno só existe depois que o elemento conecta no DOM (oninit roda
    // no connectedCallback); se ainda não existir aqui, tenta de novo logo em seguida.
    requestAnimationFrame(() => ligarSom(box, v));
    return;
  }
  botao.onclick = (e) => {
    e.stopPropagation();
    v.video.muted = !v.video.muted;
    if (!v.video.muted) v.video.play().catch(() => {});
    atualizar();
  };
  atualizar();
}

if (CAMERAS.length === 0) {
  grade.innerHTML = `<div class="vazio">Nenhuma câmera configurada ainda.<br>
    Abra a <a href="javascript:void(0)" onclick="document.getElementById('linkConfig').click()">tela de configuração</a> para adicionar.</div>`;
}

CAMERAS.forEach((cam) => {
  const box = document.createElement("div");
  box.className = "cam";
  box.tabIndex = 0;
  box.innerHTML = `<div class="nome"></div>
    <button class="expandir" title="Tela cheia">⛶</button>
    <button class="som" title="Ligar/desligar som">🔇</button>`;
  box.querySelector(".nome").textContent = cam.nome;
  const v0 = montar(cam, false);
  box.appendChild(v0);
  ligarSom(box, v0);
  const abrir = () => {
    document.body.classList.add("cheio");
    box.classList.add("ativa");
    box.querySelector("video-stream").remove();
    const v = montar(cam, true);
    box.appendChild(v);
    ligarSom(box, v);
    voltar.hidden = false;
  };
  box.querySelector(".expandir").addEventListener("click", (e) => { e.stopPropagation(); abrir(); });
  box.addEventListener("keydown", (e) => { if (e.key === "Enter") abrir(); });
  box._fechar = () => {
    box.classList.remove("ativa");
    box.querySelector("video-stream").remove();
    const v = montar(cam, false);
    box.appendChild(v);
    ligarSom(box, v);
  };
  grade.appendChild(box);
});

function sair() {
  document.body.classList.remove("cheio");
  voltar.hidden = true;
  document.querySelectorAll(".cam.ativa").forEach((b) => b._fechar());
}
voltar.addEventListener("click", sair);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" || e.key === "Backspace") sair(); });
</script>
</body>
</html>
